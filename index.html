<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario Interactivo de Verbos en Inglés</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <meta name="google-site-verification" content="7eKeqzdCOCPTjnG6WRMZGFatDUytiBC_HdHT6jc5Qcw" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">English Verbs Pro</h1>
                    <p class="text-xs text-slate-400">Diccionario interactivo con conjugaciones, usos y ejemplos</p>
                </div>
            </div>

            <!-- Buscador general -->
            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Buscar verbo en inglés o español..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

        <!-- Apartado: Más Usados / Populares -->
        <section class="bg-gradient-to-br from-indigo-950/40 via-slate-900/60 to-slate-900 border border-indigo-500/20 rounded-3xl p-6 shadow-xl">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-indigo-400">🔥</span>
                <h2 class="text-sm font-bold uppercase tracking-wider text-indigo-300">Más Usados / Populares</h2>
            </div>
            <div id="popularVerbsContainer" class="flex flex-wrap gap-2.5">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

        <!-- Filtros de Clasificación -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900/50 border border-slate-800 p-4 rounded-2xl">
            <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-2 sm:pb-0">
                <button onclick="setFilterType('all')" id="btnFilterAll" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 transition-all whitespace-nowrap">Todos</button>
                <button onclick="setFilterType('regular')" id="btnFilterReg" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">Regulares</button>
                <button onclick="setFilterType('irregular')" id="btnFilterIrreg" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all whitespace-nowrap">Irregulares</button>
            </div>
            <div id="activeFilterBadge" class="text-xs text-slate-400 font-medium">Mostrando todos los verbos</div>
        </div>

        <!-- Barra de Navegación Alfabética (A-Z) -->
        <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-3 flex flex-wrap justify-center gap-1.5" id="alphabetNav">
            <!-- Se llena por JS -->
        </div>

        <!-- Contenedor Principal de Verbos -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-200">Listado de Verbos</h3>
                <span id="verbCount" class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-lg">0 verbos</span>
            </div>
            <div id="verbsContainer" class="grid grid-cols-1 gap-4">
                <!-- Tarjetas generadas por JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 bg-slate-900/40">
        <p>Diccionario Interactivo de Verbos en Inglés &bull; Creado para aprendizaje efectivo.</p>
    </footer>

    <!-- Vinculación del archivo JavaScript externo -->
    <script src="app.js"></script>
</body>
</html>
